spring:
  application:
    name: dravya-setu-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dravya_setu}
    username: ${DB_USERNAME:dravya_app}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000

  ai:
    base-url: ${AI_BASE_URL:http://localhost:8001}
    identify-path: ${AI_IDENTIFY_PATH:/identify}
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${AI_READ_TIMEOUT_MS:30000}

server:
  port: 8080