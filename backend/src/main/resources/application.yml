spring:
  application:
    name: dravya-setu-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dravya_setu}
    username: ${DB_USERNAME:dravya_app}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000

server:
  port: 8080