services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      dravyasetu-network:
        ipv4_address: 172.30.77.2

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    environment:
      - DB_URL=${DB_URL:-jdbc:postgresql://postgres:5432/dravya_setu}
      - DB_USERNAME=${DB_USERNAME:-dravya_app}
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-min-32-chars-long-enough}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-real-ai,real-knowledge}
      - AI_BASE_URL=${AI_BASE_URL:-http://host.docker.internal:8001}
      - KNOWLEDGE_BASE_URL=${KNOWLEDGE_BASE_URL:-https://dravyasetu-knowledge-service.onrender.com}
      - AI_IDENTIFY_PATH=${AI_IDENTIFY_PATH:-/ai/analyze}
      - AI_CONNECT_TIMEOUT_MS=${AI_CONNECT_TIMEOUT_MS:-10000}
      - AI_READ_TIMEOUT_MS=${AI_READ_TIMEOUT_MS:-90000}
      - AI_IMAGE_TRANSPORT=${AI_IMAGE_TRANSPORT:-multipart}
      - IDENTIFICATION_MAX_IMAGES=${IDENTIFICATION_MAX_IMAGES:-5}
      - KNOWLEDGE_ASK_PATH=${KNOWLEDGE_ASK_PATH:-/knowledge/chat}
      - B2_STORAGE_ENABLED=${B2_STORAGE_ENABLED:-false}
      - B2_BUCKET=${B2_BUCKET:-}
      - B2_ENDPOINT=${B2_ENDPOINT:-}
      - B2_REGION=${B2_REGION:-}
      - B2_APPLICATION_KEY_ID=${B2_APPLICATION_KEY_ID:-}
      - B2_APPLICATION_KEY=${B2_APPLICATION_KEY:-}
      - B2_PATH_STYLE=${B2_PATH_STYLE:-true}
      - B2_PRESIGN_TTL=${B2_PRESIGN_TTL:-60m}
      - B2_AI_PRESIGN_TTL=${B2_AI_PRESIGN_TTL:-15m}
      - B2_MAX_HEATMAP_BYTES=${B2_MAX_HEATMAP_BYTES:-5242880}
      - B2_HEATMAP_TIMEOUT=${B2_HEATMAP_TIMEOUT:-10s}
      - B2_HEATMAP_ALLOWED_HOSTS=${B2_HEATMAP_ALLOWED_HOSTS:-}
      - CORS_ALLOWED_ORIGIN_PATTERNS=${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - TRUSTED_PROXY_CIDRS=172.30.77.2/32
      # Transactional email. Set these to a real provider in production; without them
      # registration fails with 503 EMAIL_DELIVERY_FAILED by design.
      - MAIL_ENABLED=${MAIL_ENABLED:-true}
      - MAIL_PROVIDER=${MAIL_PROVIDER:-smtp}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-no-reply@dravyasetu.local}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-DravyaSetu}
      - MAIL_STARTTLS=${MAIL_STARTTLS:-true}
      - MAIL_SSL=${MAIL_SSL:-false}
      - OTP_HASH_SECRET=${OTP_HASH_SECRET:-}
      - OTP_TTL_MINUTES=${OTP_TTL_MINUTES:-5}
      - OTP_MAX_ATTEMPTS=${OTP_MAX_ATTEMPTS:-5}
      - OTP_RESEND_COOLDOWN_SECONDS=${OTP_RESEND_COOLDOWN_SECONDS:-60}
      - OTP_MAX_PER_HOUR=${OTP_MAX_PER_HOUR:-5}
      - PASSWORD_RESET_TICKET_TTL_MINUTES=${PASSWORD_RESET_TICKET_TTL_MINUTES:-10}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dravyasetu-network

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dravya_setu
      POSTGRES_USER: dravya_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dravya_app -d dravya_setu"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dravyasetu-network

volumes:
  postgres_data:

networks:
  dravyasetu-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.77.0/24
          ip_range: 172.30.77.128/25
