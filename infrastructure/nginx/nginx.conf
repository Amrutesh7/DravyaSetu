# Nginx reverse proxy for DravyaSetu backend
upstream backend {
    server backend:8080;
}

server {
    listen 80;
    server_name localhost;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Proxy to Spring Boot backend
    location /api/ {
        client_max_body_size 10m;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://backend/api/v1/health;
        access_log off;
    }

    # Static files (if any)
    location /static/ {
        proxy_pass http://backend/api/v1/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Security headers must be repeated here because nginx does not inherit
        # add_header from server level when location defines its own
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
    }
}
