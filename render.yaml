# Create from Render > New > Blueprint. Supply sync:false values in its secure form.
# Do not place actual credentials in this file.
services:
  - type: web
    name: dravyasetu-backend
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: real-ai,real-knowledge,production
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_HASH_SECRET
        generateValue: true
      - key: MAIL_ENABLED
        value: "true"
      - key: MAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: DravyaSetu
      - key: AI_BASE_URL
        value: https://a760-st--dravyasetu-ai-fastapi-app.us-east.modal.run
      - key: AI_IMAGE_TRANSPORT
        value: multipart
      - key: KNOWLEDGE_BASE_URL
        value: https://dravyasetu-knowledge-service.onrender.com
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        value: http://localhost:5173,http://localhost:3000
      - key: B2_STORAGE_ENABLED
        value: "true"
      - key: B2_BUCKET
        sync: false
      - key: B2_ENDPOINT
        sync: false
      - key: B2_REGION
        sync: false
      - key: B2_APPLICATION_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=65.0 -XX:+UseSerialGC
